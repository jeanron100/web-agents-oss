<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b0f14'/%3E%3Ctext x='50' y='66' font-size='48' text-anchor='middle' fill='%232dd4a7'%3E⌘%3C/text%3E%3C/svg%3E" />
    <title>Agent 管控台</title>
    <script>
    // 防闪烁：在样式生效**之前**就把主题写到 <html> 上。
    // 放在 React 里做会先闪一帧默认深色（浅色主题用户尤其明显）。
    (function () {
      try {
        var t = localStorage.getItem('agent-console-theme');
        var a = localStorage.getItem('agent-console-accent');
        if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
        if (a && a !== 'blue') document.documentElement.setAttribute('data-accent', a);
      } catch (e) {}
    })();
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
